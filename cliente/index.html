<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miguel Lanches — Fazer pedido</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span>MIGUEL</span><b>LANCHES</b></div>
  <button id="openCart" class="cartBtn">🛒 <span>Meu pedido</span><i id="cartCount">0</i></button>
</header>

<main>
<section class="hero">
  <small>PEÇA PELO CELULAR</small>
  <h1>Seu lanche do seu jeito.</h1>
  <p>Escolha seus produtos, monte seu pedido e envie para a gente.</p>
</section>

<div class="search"><span>⌕</span><input id="search" placeholder="Buscar no cardápio..."></div>
<nav id="categories" class="categories"></nav>
<section id="products" class="products"></section>
</main>

<div id="overlay" class="overlay"></div>

<aside id="cart" class="cart">
  <div class="cartHead">
    <div><small>SEU PEDIDO</small><h2>Minha comanda</h2></div>
    <button id="closeCart">×</button>
  </div>
  <div id="cartItems"></div>
  <div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div>

  <div class="customer">
    <h3>Seus dados</h3>
    <label>Nome<input id="nome" placeholder="Seu nome"></label>
    <label>WhatsApp<input id="telefone" inputmode="tel" placeholder="(00) 00000-0000"></label>
    <label>Endereço<input id="endereco" placeholder="Rua, número, bairro"></label>
    <label>Referência<input id="referencia" placeholder="Ex.: perto da praça"></label>
    <label>Observações<textarea id="observacoes" placeholder="Ex.: sem cebola..."></textarea></label>
    <button id="send" class="send">ENVIAR PEDIDO</button>
  </div>
</aside>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button id="modalClose">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
