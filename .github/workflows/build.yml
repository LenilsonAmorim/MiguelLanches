name: Gerar APK Miguel Lanches Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: Projeto Android não encontrado."
            echo "Coloque o projeto do APK no repositório."
            exit 1
          fi

          echo "Projeto encontrado em: $(dirname "$SETTINGS")"

      - name: Gerar APK
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          DIR=$(dirname "$SETTINGS")

          cd "$DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Localizar APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"

          mkdir -p apk-final
          cp "$APK" apk-final/MiguelLanches-Realtime.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Realtime
          path: apk-final/MiguelLanches-Realtime.apk
          if-no-files-found: error
