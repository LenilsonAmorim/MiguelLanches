name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair o ZIP
        run: |
          rm -rf projeto
          mkdir projeto

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          unzip -q "$ZIP" -d projeto

          echo "Arquivos encontrados:"
          find projeto -maxdepth 3 -type f | head -100

      - name: Localizar projeto Android
        run: |
          if [ -f "projeto/settings.gradle" ] || [ -f "projeto/settings.gradle.kts" ]; then
            echo "Projeto encontrado na raiz."
          else
            SETTINGS=$(find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -n "$SETTINGS" ]; then
              DIR=$(dirname "$SETTINGS")
              echo "Projeto encontrado em: $DIR"

              if [ "$DIR" != "projeto" ]; then
                cp -r "$DIR"/. projeto/
              fi
            else
              echo "ERRO: Projeto Gradle não encontrado."
              exit 1
            fi
          fi

      - name: Gerar APK
        working-directory: projeto
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Mostrar APK gerado
        run: |
          echo "================================"
          echo "APKs encontrados:"
          echo "================================"
          find projeto -type f -name "*.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Adicionais-v3
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
