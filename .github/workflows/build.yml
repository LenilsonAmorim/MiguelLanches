name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair o ZIP
        run: |
          rm -rf projeto
          mkdir projeto

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          unzip -q "$ZIP" -d projeto

          echo "Conteúdo extraído:"
          find projeto -maxdepth 2 -type f | head -50

      - name: Localizar projeto Android
        run: |
          if [ -f "projeto/settings.gradle" ] || [ -f "projeto/settings.gradle.kts" ]; then
            echo "Projeto encontrado na raiz."
          elif [ -f "projeto/app/build.gradle" ] || [ -f "projeto/app/build.gradle.kts" ]; then
            echo "Projeto Android encontrado."
          else
            SETTINGS=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1)

            if [ -n "$SETTINGS" ]; then
              DIR=$(dirname "$SETTINGS")
              echo "Projeto encontrado em: $DIR"
              mv "$DIR"/* projeto/ 2>/dev/null || true
              mv "$DIR"/.* projeto/ 2>/dev/null || true
            fi
          fi

      - name: Gerar APK
        working-directory: projeto
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Encontrar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Corrigido-58mm-v2
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
