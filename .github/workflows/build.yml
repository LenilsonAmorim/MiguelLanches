name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Comanda GitHub
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q MiguelLanchesComanda_GitHub.zip -d projeto

      - name: Gerar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Comanda-GitHub-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
