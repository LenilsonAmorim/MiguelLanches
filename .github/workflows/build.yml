name: Gerar APK Miguel Lanches Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto APK
        run: |
          unzip -o MiguelLanches-APK-realtime.zip -d apk-project
          echo "Projeto extraído:"
          find apk-project -maxdepth 3 -type f | sort

      - name: Verificar projeto Android
        run: |
          if [ ! -f "apk-project/settings.gradle" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            find apk-project -type f | sort
            exit 1
          fi

          echo "Projeto Android encontrado!"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        working-directory: apk-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          find apk-project -type f -name "*.apk" -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Realtime
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
