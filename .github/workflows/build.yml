name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto v9
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q MiguelLanches-v9-Clientes-Automaticos.zip -d projeto

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: Projeto Gradle não encontrado."
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ "$DIR" != "projeto" ]; then
            cp -r "$DIR"/. projeto/
          fi

      - name: Gerar APK
        working-directory: projeto
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Localizar APK
        run: |
          echo "===== APK ENCONTRADO ====="

          APK=$(find projeto -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK: $APK"

          mkdir -p apk-final
          cp "$APK" apk-final/MiguelLanches-v9-Clientes-Automaticos.apk

          ls -lh apk-final/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-v9-Clientes-Automaticos
          path: apk-final/MiguelLanches-v9-Clientes-Automaticos.apk
          if-no-files-found: error
