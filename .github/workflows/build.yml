name: Gerar APK Miguel Lanches Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto APK
        run: |
          unzip -o MiguelLanches-APK-realtime-auto-atualizacao.zip -d apk-project

      - name: Verificar projeto
        run: |
          test -f apk-project/settings.gradle
          echo "Projeto Android encontrado."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        working-directory: apk-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Realtime-AutoAtualizacao
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
