name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Comanda v2
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q MiguelLanchesComanda_v2_Android.zip -d projeto

      - name: Gerar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-Comanda-v2-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3949AB</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>

          </resources>
          EOF

          cat > app/src/main/java/br/com/miguellanches/funcionario/MainActivity.kt <<'EOF'
          package br.com.miguellanches.funcionario

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(24, 24, 24, 24)
                  root.setBackgroundColor(Color.WHITE)

                  val titulo = TextView(this)
                  titulo.text = "MIGUEL LANCHES"
                  titulo.textSize = 26f
                  titulo.setTextColor(Color.rgb(35, 55, 150))
                  titulo.gravity = Gravity.CENTER
                  titulo.setPadding(0, 20, 0, 30)

                  root.addView(
                      titulo,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val subtitulo = TextView(this)
                  subtitulo.text = "COMANDA DO FUNCIONÁRIO"
                  subtitulo.textSize = 18f
                  subtitulo.gravity = Gravity.CENTER
                  subtitulo.setPadding(0, 0, 0, 20)

                  root.addView(subtitulo)

                  val categorias = arrayOf(
                      "🍕 PIZZAS",
                      "🥟 PASTÉIS",
                      "🍔 SANDUÍCHES",
                      "🍟 PORÇÕES",
                      "🍧 AÇAÍ",
                      "🥤 BEBIDAS",
                      "🥩 CHURRASCO"
                  )

                  for (categoria in categorias) {
                      val botao = Button(this)
                      botao.text = categoria
                      botao.textSize = 17f

                      root.addView(
                          botao,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              65
                          ).apply {
                              setMargins(0, 5, 0, 5)
                          }
                      )
                  }

                  val comanda = TextView(this)
                  comanda.text = "COMANDA\n\nNenhum produto selecionado"
                  comanda.textSize = 17f
                  comanda.setPadding(20, 30, 20, 30)

                  root.addView(
                      comanda,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiguelLanches-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
