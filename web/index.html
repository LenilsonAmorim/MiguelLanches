<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Miguel Lanches — Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- LOGIN -->
  <section id="login" class="card login-card">

    <div class="brand">MIGUEL LANCHES</div>

    <p class="muted">Sistema de pedidos</p>

    <label>
      Usuário
      <input id="username" type="text" placeholder="Usuário">
    </label>

    <label>
      Senha
      <input id="password" type="password" placeholder="Senha">
    </label>

    <button id="loginBtn" class="primary" type="button">
      Entrar
    </button>

    <p id="loginMsg" class="error"></p>

  </section>


  <!-- PEDIDOS -->
  <section id="orders" class="hidden">

    <header class="topbar">

      <div>
        <strong>MIGUEL LANCHES</strong>
        <span>Pedidos</span>
      </div>

      <button id="logoutBtn" class="ghost" type="button">
        Sair
      </button>

    </header>


    <div class="grid">

      <!-- NOVO PEDIDO -->
      <section class="card">

        <h2>Novo pedido</h2>


        <div class="row">

          <label>
            Cliente
            <input
              id="cliente"
              type="text"
              placeholder="Nome do cliente"
            >
          </label>

          <label>
            Telefone
            <input
              id="telefone"
              type="text"
              placeholder="Telefone"
            >
          </label>

        </div>


        <label>
          Endereço
          <input
            id="endereco"
            type="text"
            placeholder="Rua, número, bairro"
          >
        </label>


        <label>
          Referência
          <input
            id="referencia"
            type="text"
            placeholder="Ponto de referência"
          >
        </label>


        <h3>Itens</h3>

        <div id="items"></div>


        <button
          id="addItemBtn"
          class="secondary"
          type="button"
        >
          + Adicionar item
        </button>


        <label>
          Observações

          <textarea
            id="observacoes"
            placeholder="Observações do pedido"
          ></textarea>

        </label>


        <div class="total">
          Total:
          <span id="total">R$ 0,00</span>
        </div>


        <button
          id="sendBtn"
          class="primary"
          type="button"
        >
          Enviar pedido
        </button>

      </section>


      <!-- PEDIDOS ENVIADOS -->
      <aside class="card">

        <h2>Pedidos enviados</h2>

        <div id="ordersList">
          <p class="muted">
            Nenhum pedido enviado.
          </p>
        </div>

      </aside>

    </div>

  </section>

</main>


<!-- IMPORTANTE:
     O app.js será carregado depois que a página inteira existir.
-->
<script src="app.js?v=1000"></script>

</body>
</html>
