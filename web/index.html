<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Miguel Lanches — Pedidos</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- LOGIN -->
  <section id="login" class="card login-card">

    <div class="brand">
      MIGUEL LANCHES
    </div>

    <p class="muted">
      Sistema de pedidos
    </p>

    <label>
      Usuário

      <input
        id="username"
        type="text"
        placeholder="Usuário"
      >
    </label>

    <label>
      Senha

      <input
        id="password"
        type="password"
        placeholder="Senha"
      >
    </label>

    <button
      id="loginBtn"
      class="primary"
      type="button"
      onclick="
        document.getElementById('login').classList.add('hidden');
        document.getElementById('orders').classList.remove('hidden');
      "
    >
      Entrar
    </button>

    <p id="loginMsg" class="error"></p>

    <p class="hint">
      Protótipo inicial.
    </p>

  </section>


  <!-- PEDIDOS -->
  <section id="orders" class="hidden">

    <header class="topbar">

      <div>
        <strong>MIGUEL LANCHES</strong>
        <span>Pedidos</span>
      </div>

      <button
        id="logoutBtn"
        class="ghost"
        type="button"
        onclick="
          document.getElementById('orders').classList.add('hidden');
          document.getElementById('login').classList.remove('hidden');
        "
      >
        Sair
      </button>

    </header>


    <div class="grid">

      <!-- NOVO PEDIDO -->
      <section class="card">

        <h2>
          Novo pedido
        </h2>


        <div class="row">

          <label>
            Cliente

            <input
              id="cliente"
              type="text"
              placeholder="Nome do cliente"
            >
          </label>


          <label>
            Telefone

            <input
              id="telefone"
              type="text"
              placeholder="Telefone"
            >
          </label>

        </div>


        <label>
          Endereço

          <input
            id="endereco"
            type="text"
            placeholder="Rua, número, bairro"
          >
        </label>


        <label>
          Referência

          <input
            id="referencia"
            type="text"
            placeholder="Ponto de referência"
          >
        </label>


        <h3>
          Itens
        </h3>


        <div id="items">

          <div class="item">

            <input
              type="text"
              placeholder="Produto"
            >

            <input
              type="number"
              min="1"
              value="1"
              placeholder="Qtd"
            >

            <input
              type="number"
              min="0"
              step="0.01"
              placeholder="Preço"
            >

            <button
              type="button"
              class="secondary"
            >
              ×
            </button>

          </div>

        </div>

          id="addItem
