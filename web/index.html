<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Miguel Lanches</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- MENU LATERAL -->

  <aside id="sidebar">

    <div class="logo">
      <div class="logo-title">MIGUEL</div>
      <div class="logo-subtitle">LANCHES</div>
    </div>

    <nav>

      <button
        class="menu-item active"
        data-page="dashboard"
        type="button">
        🛒
        <span>Fazer Pedido</span>
      </button>

      <button
        class="menu-item"
        data-page="comandas"
        type="button">
        📋
        <span>Comandas Abertas</span>
      </button>

      <button
        class="menu-item"
        data-page="historico"
        type="button">
        📚
        <span>Histórico</span>
      </button>

      <button
        class="menu-item"
        data-page="impressao"
        type="button">
        🖨️
        <span>Impressão</span>
      </button>

    </nav>

    <div class="sidebar-footer">
      Miguel Lanches
      <small>Sistema de Pedidos</small>
    </div>

  </aside>


  <!-- CONTEÚDO -->

  <main id="content">

    <header id="topbar">

      <button
        id="menuToggle"
        type="button">
        ☰
      </button>

      <div>

        <strong id="pageTitle">
          Fazer Pedido
        </strong>

        <small>
          Monte a comanda do cliente
        </small>

      </div>

      <button
        id="logoutBtn"
        type="button">
        Sair
      </button>

    </header>


    <!-- =========================
         PÁGINA PRINCIPAL
    ========================== -->

    <section
      id="page-dashboard"
      class="page active-page">

      <div class="page-header">

        <div>

          <h1>
            Fazer Pedido
          </h1>

          <p>
            Escolha os produtos para adicionar à comanda.
          </p>

        </div>

      </div>


      <!-- BUSCA -->

      <div class="search-box">

        <input
          id="productSearch"
          type="search"
          placeholder="🔎 Buscar produto..."
        >

      </div>


      <!-- CATEGORIAS
