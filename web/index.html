<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miguel Lanches Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id=login class=login><div><h1>MIGUEL <b>LANCHES</b></h1><small>PAINEL ADMINISTRATIVO</small><label>Usuário<input id=user></label><label>Senha<input id=pass type=password></label><button id=loginBtn>Entrar</button><p id=msg></p></div></div>
<div id=app class=hide><aside id=side><h2>MIGUEL <b>LANCHES</b></h2><nav><button data-page=pedidos class=active>Pedidos <b id=badge>0</b></button><button data-page=dashboard>Dashboard</button><button data-page=cardapio>Cardápio</button><button data-page=categorias>Categorias</button><button data-page=clientes>Clientes</button><button data-page=promocoes>Promoções</button><button data-page=relatorios>Relatórios</button><button data-page=config>Configurações</button><button data-page=impressao>Impressão</button></nav><a href="../cliente/index.html">Site do cliente</a><button id=logout>Sair</button></aside><main><header><button id=menu>☰</button><b id=title>Pedidos</b><button id=refresh>Atualizar</button></header>
<section id=page-pedidos class="page active"><div class=head><div><h1>Pedidos</h1><p>Recebidos do site do cliente.</p></div></div><div id=tabs class=tabs><button class=active data-f=todos>Todos <b>0</b></button><button data-f=novo>Novos <b>0</b></button><button data-f=preparo>Preparando <b>0</b></button><button data-f=entrega>Entrega <b>0</b></button><button data-f=entregue>Entregues <b>0</b></button><button data-f=cancelado>Cancelados <b>0</b></button></div><div id=orders class=board></div></section>
<section id=page-dashboard class=page><h1>Dashboard</h1><div id=stats class=stats></div><div class=panel id=recent></div></section>
<section id=page-cardapio class=page><div class=head><h1>Cardápio</h1><button id=newProduct class=primary>+ Produto</button></div><input id=ps class=search placeholder="Buscar produto"><div class=panel><table><tbody id=products></tbody></table></div></section>
<section id=page-categorias class=page><div class=head><h1>Categorias</h1><button id=newCat class=primary>+ Categoria</button></div><div id=cats class=cards></div></section>
<section id=page-clientes class=page><h1>Clientes</h1><input id=cs class=search placeholder="Buscar cliente"><div class=panel><table><tbody id=clients></tbody></table></div></section>
<section id=page-promocoes class=page><h1>Promoções</h1><div class=panel><p>Área pronta para campanhas vinculadas ao cardápio.</p></div></section>
<section id=page-relatorios class=page><h1>Relatórios</h1><div id=reports class=stats></div><button id=csv>Exportar CSV</button></section>
<section id=page-config class=page><h1>Configurações</h1><div class=form><label>Nome<input id=store></label><label>Telefone<input id=phoneStore></label><label>Taxa de entrega<input id=fee type=number step=.01></label><button id=save class=primary>Salvar</button></div></section>
<section id=page-impressao class=page><h1>Impressão</h1><div class=panel><button id=test class=primary>Imprimir teste 58 mm</button></div></section>
</main></div><div id=modal class="overlay hide"><div class=modal><button id=close>×</button><div id=body></div></div></div><div id=toast></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../cliente/config.js"></script><script src="admin.js"></script></body></html>
