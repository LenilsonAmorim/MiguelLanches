<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acompanhar pedido — Miguel Lanches</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f7f7f7;color:#151515}
.top{background:#050505;color:#fff;padding:18px;text-align:center}.top img{width:78px;height:78px;object-fit:contain}.top h1{font-size:20px;margin:4px 0}
.page{max-width:560px;margin:auto;padding:18px 15px 40px}.back{display:inline-block;color:#111;text-decoration:none;font-weight:900;font-size:13px;margin-bottom:14px}
.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:20px;box-shadow:0 2px 14px #0000000d}.empty{text-align:center;padding:34px 18px}.empty h2{margin:0 0 8px;font-size:22px}.empty p{color:#777;line-height:1.45}
.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:22px}.date{font-size:11px;color:#777;margin-top:5px}.badge{background:#fff5d6;color:#765600;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:900;white-space:nowrap}
.timeline{margin:24px 0}.step{display:flex;gap:12px;position:relative;padding-bottom:20px}.step:last-child{padding-bottom:0}.dot{width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:2}.step.active .dot,.step.done .dot{background:#f4bd17}.line{position:absolute;left:14px;top:30px;bottom:0;width:2px;background:#e5e5e5}.step.done .line{background:#f4bd17}.step h3{margin:2px 0 4px;font-size:14px}.step p{margin:0;color:#777;font-size:11px;line-height:1.35}
.items{border-top:1px solid #eee;padding-top:14px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}.item small{display:block;color:#777;margin-top:2px}.total{display:flex;justify-content:space-between;border-top:1px solid #eee;margin-top:8px;padding-top:12px;font-size:17px;font-weight:900}.primary{width:100%;min-height:46px;margin-top:15px;border:0;border-radius:11px;background:#f4bd17;color:#111;font-weight:900}.refresh{text-align:center;color:#888;font-size:10px;margin-top:15px}
</style>
</head><body>
<header class="top"><img src="assets/logo.png" alt="Miguel Lanches"><h1>Acompanhar pedido</h1></header>
<main class="page"><a class="back" href="index.html">← Voltar ao cardápio</a><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="js/tracking.js"></script>
</body></html>
