<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b71924">
<title>Miguel Lanches</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span>MIGUEL</span><b>LANCHES</b></div>
</header>

<main>
  <div class="search"><span>⌕</span><input id="search" placeholder="Buscar produto..."></div>
  <nav id="categories" class="categories"></nav>
  <section id="products" class="products"></section>
</main>

<div id="overlay" class="overlay"></div>

<aside id="cart" class="cart">
  <div class="cart-head">
    <div><h2>Sua sacola</h2><small id="cartItemCount">0 itens</small></div>
    <button id="closeCart" class="icon-btn">×</button>
  </div>
  <button id="clearCart" class="clear-cart">LIMPAR SACOLA</button>
  <div id="cartItems"></div>
  <button id="addMore" class="add-more">ADICIONAR MAIS ITENS</button>
  <div class="summary">
    <div><span>Subtotal</span><b id="subtotal">R$ 0,00</b></div>
    <div id="feeRow"><span>Taxa de entrega</span><b id="deliveryFee">R$ 0,00</b></div>
    <div class="summary-total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
  </div>
  <button id="continueOrder" class="primary">CONTINUAR PEDIDO</button>
</aside>

<button id="openCart" class="bottom-bag">
  <span>🛍️ <i id="cartCount">0</i></span><strong>Ver sacola</strong><b id="bottomCartTotal">R$ 0,00</b>
</button>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modalClose" class="icon-btn close-modal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="checkout" class="checkout hidden">
  <div class="checkout-box">
    <div class="checkout-head">
      <button id="closeCheckout" class="icon-btn">‹</button>
      <h2>Finalizar pedido</h2><span></span>
    </div>

    <section class="receive-section">
      <h3>Como você quer receber?</h3>
      <div class="receive-options">
        <button class="receive-option" data-method="entrega"><span>🛵</span><div><b>Entrega</b><small>A gente leva até você</small></div></button>
        <button class="receive-option" data-method="retirada"><span>🚶</span><div><b>Retirada</b><small>Você retira no local</small></div></button>
      </div>
    </section>

    <section id="savedAddress" class="saved-address hidden">
      <div><small>Endereço salvo</small><strong id="savedAddressText"></strong></div>
      <button id="changeAddress">Trocar</button>
    </section>

    <section id="customerSection" class="customer-section hidden">
      <h3>Seus dados</h3>
      <input id="nome" placeholder="Nome *">
      <input id="telefone" placeholder="WhatsApp *" inputmode="tel">

      <div id="deliveryFields" class="hidden">
        <label>Bairro *</label>
        <select id="bairro"><option value="">Selecione o bairro *</option></select>
        <input id="endereco" placeholder="Endereço *">
        <input id="referencia" placeholder="Ponto de referência *">
      </div>

      <label>Forma de pagamento *</label>
      <select id="pagamento">
        <option value="">Selecione *</option>
        <option>PIX</option>
        <option>Cartão de crédito</option>
        <option>Cartão de débito</option>
        <option>Dinheiro</option>
      </select>

      <div id="paymentMoney" class="money-box hidden">
        <input id="valorPago" type="number" min="0" step="0.01" placeholder="Valor que irá pagar *">
        <strong id="trocoPreview"></strong>
      </div>

      <label>Observação do pedido</label>
      <textarea id="observacoes" placeholder="Alguma observação?"></textarea>

      <div class="summary checkout-summary">
        <div><span>Subtotal</span><b id="checkoutSubtotal">R$ 0,00</b></div>
        <div><span>Taxa de entrega</span><b id="checkoutFee">R$ 0,00</b></div>
        <div class="summary-total"><span>Total</span><strong id="checkoutTotal">R$ 0,00</strong></div>
      </div>
      <button id="send" class="primary">ENVIAR PEDIDO</button>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
