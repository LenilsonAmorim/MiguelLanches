<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Miguel Lanches — Hambúrgueria e Pizzaria">
  <link rel="icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Miguel Lanches</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="assets/logo.png" alt="Miguel Lanches">
    <div class="loader"></div>
  </div>

  <header class="topbar">
    <button class="circle-btn" id="backBtn" aria-label="Voltar">‹</button>
    <div class="mini-brand"><img src="assets/logo.png" alt=""><div><b>Miguel Lanches</b><small id="storeStatus">● online</small></div></div>
    <button class="circle-btn" id="headerCart" aria-label="Sacola">🛍️<span id="badge">0</span></button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="store-card">
        <div class="store-logo"><img src="assets/logo.png" alt="Logo"></div>
        <div><h1>Miguel Lanches</h1><p>⭐ <b>5,0</b> • Hambúrgueria e Pizzaria</p><p class="muted">Entrega rápida • Pedido online</p></div>
      </div>

      <div class="search"><span>⌕</span><input id="search" placeholder="Busque por item ou categoria..."></div>
      <div id="categoryTabs" class="chips"></div>

      <section class="section">
        <div class="section-head"><h2>Destaques</h2><button id="allProducts">Ver todos</button></div>
        <div id="featured" class="featured-grid"></div>
      </section>

      <section id="catalog" class="section"></section>
    </section>

    <section id="categoryView" class="view">
      <div class="page-title"><span id="categoryTitle">Categorias</span></div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <section id="cartView" class="view">
      <div class="page-title"><span>Sua sacola</span><button id="clearCart" class="text-btn">Limpar</button></div>
      <div id="cartList"></div>
      <div id="cartSummary" class="summary-card"></div>
      <button class="primary wide" id="goCheckout">Continuar</button>
    </section>

    <section id="checkoutView" class="view">
      <div class="page-title"><span>Finalizar pedido</span></div>
      <form id="checkoutForm" class="form-card">
        <h3>Seus dados</h3>
        <label>Nome<input id="clientName" required placeholder="Seu nome"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" placeholder="(84) 99999-9999"></label>

        <h3>Recebimento</h3>
        <div class="segmented"><button type="button" data-mode="entrega" class="active">🛵 Entrega</button><button type="button" data-mode="retirada">🏪 Retirar</button></div>
        <div id="addressFields">
          <label>Endereço<input id="address" placeholder="Rua, número"></label>
          <label>Bairro<select id="neighborhood"><option value="">Selecione o bairro</option></select></label>
          <label>Ponto de referência<input id="reference" placeholder="Ex.: perto da praça"></label>
        </div>

        <h3>Pagamento</h3>
        <div class="payment-grid">
          <button type="button" data-payment="Dinheiro" class="pay active">💵 Dinheiro</button>
          <button type="button" data-payment="Cartão" class="pay">💳 Cartão</button>
          <button type="button" data-payment="Pix" class="pay">📱 Pix</button>
        </div>
        <label id="changeWrap">Troco para <input id="changeFor" inputmode="decimal" placeholder="Ex.: 50"></label>
        <label>Observações<textarea id="notes" placeholder="Ex.: sem cebola..."></textarea></label>
        <div id="checkoutTotal"></div>
        <button class="primary wide" type="submit">Confirmar pedido</button>
      </form>
    </section>

    <section id="trackingView" class="view">
      <div class="page-title"><span>Meu pedido</span></div>
      <div id="trackingCard" class="tracking-card"></div>
    </section>
  </main>

  <div id="productModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="closeProduct">×</button>
      <div id="productModalContent"></div>
    </div>
  </div>

  <div id="cartBar" class="cart-bar hidden">
    <button id="openCart"><span>🛍️ <b id="barCount">0</b></span><strong>Ver sacola</strong><b id="barTotal">R$ 0,00</b></button>
  </div>

  <nav class="bottom-nav">
    <button data-view="homeView" class="active">⌂<small>Início</small></button>
    <button data-view="categoryView">☰<small>Categorias</small></button>
    <button data-view="cartView">🛍️<small>Sacola</small></button>
    <button data-view="trackingView">📦<small>Pedido</small></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
