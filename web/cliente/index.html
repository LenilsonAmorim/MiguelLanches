<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b71924"><title>Miguel Lanches - Pedidos</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo">MIGUEL <b>LANCHES</b></div><button id="openCart">🛒 <span id="cartCount">0</span></button></header>
<main><div class="search"><input id="search" placeholder="Buscar produto..."></div><div id="categories" class="categories"></div><div id="products" class="products"></div></main>
<div id="overlay" class="overlay"></div><aside id="cart" class="cart"><div class="cart-title"><h2>Meu pedido</h2><button id="closeCart">×</button></div><div id="cartItems"></div>
<section class="customer-form"><h3>Dados para entrega</h3>
<input id="nome" placeholder="Nome *" required>
<input id="telefone" placeholder="WhatsApp * (84) 99999-9999" inputmode="tel" required>
<select id="bairro" required><option value="">Selecione o bairro *</option></select>
<input id="endereco" placeholder="Endereço *" required>
<input id="referencia" placeholder="Ponto de referência *" required>
<label>Forma de pagamento *</label>
<select id="pagamento" required><option value="">Selecione *</option><option>PIX</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option></select>
<div id="paymentMoney" class="hidden"><input id="valorPago" type="number" min="0" step="0.01" placeholder="Valor que irá pagar *"><div id="trocoPreview"></div></div>
<textarea id="observacoes" placeholder="Observação do pedido"></textarea>
</section>
<div class="summary"><div><span>Subtotal</span><b id="subtotal">R$ 0,00</b></div><div><span>Entrega</span><b id="deliveryFee">R$ 0,00</b></div><div class="total"><span>TOTAL</span><strong id="total">R$ 0,00</strong></div></div>
<button id="send" class="primary big">Enviar pedido</button></aside>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="modalClose">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
