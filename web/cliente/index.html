<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Miguel Lanches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-box">
      <div class="splash-logo">MIGUEL <span>LANCHES</span></div>
      <p>Hamburgueria e Pizzaria</p>
      <div class="loader"><i></i></div>
    </div>
  </div>

  <header class="header">
    <div class="logo"><img src="assets/logo.png" alt="Miguel Lanches"></div>
    <div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar em Miguel Lanches"></div>
  </header>

  <nav id="categories" class="categories"></nav>
  <main id="app"></main>

  <div id="bagBar" class="bag-bar empty"></div>

  <div id="shade" class="shade"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="drawer-head"><div><small>SUA SACOLA</small><h2>Seu pedido</h2></div><button id="closeCart" class="round">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-bottom"><div class="line"><b>Total</b><strong id="cartTotal">R$ 0,00</strong></div><button id="checkoutBtn" class="main-btn">Finalizar o pedido</button></div>
  </div>

  <div id="productModal" class="modal hidden"><div id="productBody" class="product-card"></div></div>
  <div id="checkoutModal" class="modal hidden"><div id="checkoutBody" class="checkout-card"></div></div>
  <div id="successModal" class="modal hidden"><div class="success-card">
    <div class="success-icon">✓</div>
    <h2>Pedido enviado!</h2>
    <p id="orderNumber"></p>
    <p>Seu pedido já foi enviado para a loja.</p>
  </div></div>

  <div id="trackingModal" class="hidden"><div id="trackingCard"><div id="trackingBody"></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="cliente_opcoes.js"></script>
  <script src="acompanhamento_realtime.js"></script>
  <script src="integracao_acompanhamento.js"></script>
</body>
</html>
