<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Miguel Lanches</title>
<link rel="stylesheet" href="style.css">
<style>
#ml-footer{position:fixed;left:0;right:0;bottom:0;height:68px;background:#080808;display:flex;z-index:600;box-shadow:0 -5px 20px #0004}
#ml-footer button{flex:1;border:0;background:transparent;color:#aaa;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:21px}
#ml-footer button span{font-size:11px}
#ml-footer button.active{color:#f4bd17}
body{padding-bottom:94px}
#bagBar{bottom:82px!important;z-index:650!important}
html.modal-lock,body.modal-lock{overflow:hidden!important;overscroll-behavior:none!important;touch-action:none!important}
.modal{z-index:1000!important;touch-action:none!important;overscroll-behavior:contain!important}
.modal .product-card,.modal .checkout-card,.modal .success-card{touch-action:pan-y!important;overscroll-behavior-y:contain!important;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-lock #ml-footer{z-index:50!important;pointer-events:none!important}
.compat-hidden{display:none!important}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-box">
    <div class="splash-logo">MIGUEL <span>LANCHES</span></div>
    <p>Hamburgueria e Pizzaria</p>
    <div class="loader"><i></i></div>
  </div>
</div>

<div id="site" class="hidden">
<header class="header">
  <div class="logo"><img src="assets/logo.png" alt="Miguel Lanches"></div>
  <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar em Miguel Lanches" autocomplete="off"></div>
</header>

<nav id="categories" class="categories" aria-label="Categorias"></nav>

<main class="section">
  <section class="category-block">
    <div class="section-title"><h2>Destaques</h2></div>
    <div id="featured" class="featured"></div>
  </section>
  <div id="products"></div>
</main>

<div id="bagBar" class="bag-bar empty">
  <div class="bag-info">
    <div class="bag-icon">🛍️</div>
    <div><b>Sua sacola</b><small id="bagText">Sua sacola está vazia</small></div>
  </div>
  <button id="openCart" type="button">Ver sacola · <span id="bagTotal">R$ 0,00</span></button>
</div>

<div id="shade" class="shade"></div>

<div id="cartDrawer" class="cart-drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><small>SEU PEDIDO</small><h2>Sua sacola</h2></div>
    <button id="closeCart" class="round" type="button">×</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div id="emptyCart" class="compat-hidden">Sua sacola está vazia</div>
  <div class="drawer-bottom">
    <div class="line"><span>Subtotal</span><strong id="cartSubtotal">R$ 0,00</strong></div>
    <button id="addMoreItems" class="main-btn" type="button" style="margin-bottom:10px;background:#fff;border:1px solid #ddd">Adicionar mais itens</button>
    <button id="checkoutBtn" class="main-btn" type="button">Finalizar o pedido</button>
  </div>
</div>

<div id="productModal" class="modal hidden"><div id="productBody" class="product-card"></div></div>

<div id="checkoutModal" class="modal hidden">
  <div id="checkoutBody" class="checkout-card">
    <button id="checkoutClose" type="button" class="round">×</button>
    <h2>Finalizar pedido</h2>
    <form id="checkoutForm">
      <input id="customerName" class="field" required placeholder="Seu nome">
      <input id="customerPhone" class="field" required placeholder="Telefone">
      <div class="receive-row">
        <button type="button" class="receive selected" data-method="entrega">Entrega</button>
        <button type="button" class="receive" data-method="retirada">Retirar na loja</button>
      </div>
      <div id="deliveryBox">
        <input id="address" class="field" placeholder="Endereço">
        <input id="reference" class="field" placeholder="Ponto de referência">
      </div>
      <select id="payment" class="field" required>
        <option value="">Forma de pagamento</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
      </select>
      <div id="cashBox" class="hidden">
        <input id="cashValue" class="field" inputmode="numeric" placeholder="Quanto vai pagar?">
        <div id="changeValue">R$ 0,00</div>
        <small id="cashError"></small>
      </div>
      <textarea id="orderNote" class="field" placeholder="Observação"></textarea>
      <div class="line"><span>Total</span><strong id="checkoutTotal">R$ 0,00</strong></div>
      <button class="main-btn" type="submit">Enviar pedido</button>
    </form>
  </div>
</div>

<div id="successModal" class="modal hidden">
  <div class="success-card">
    <div class="success-icon">✓</div>
    <h2>Pedido enviado!</h2>
    <p id="orderNumber"></p>
    <p>Seu pedido já foi enviado para a loja.</p>
    <div style="display:grid;gap:10px;margin-top:22px">
      <button id="trackOrderBtn" class="main-btn" type="button">Acompanhar pedido</button>
      <button id="newOrderBtn" class="main-btn" type="button" style="background:#fff;border:1px solid #ddd">Novo pedido</button>
    </div>
  </div>
</div>

<div id="trackingModal" class="hidden">
  <div id="trackingCard"><div id="trackingBody"></div></div>
</div>

<div id="checkoutSubtotal" class="compat-hidden">R$ 0,00</div>
<select id="neighborhood" class="compat-hidden"></select>
<span id="navCount" class="compat-hidden">0</span>
<span id="bagStatus" class="compat-hidden">Sua sacola está vazia</span>
<span id="cartTotal" class="compat-hidden">R$ 0,00</span>
</div>

<nav id="ml-footer">
  <button id="mlHome" class="active" type="button">⌂<span>Início</span></button>
  <button id="mlOrders" type="button">▣<span>Pedidos</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
window.db=window.supabase.createClient(window.ML_CONFIG.SUPABASE_URL,window.ML_CONFIG.SUPABASE_KEY);
window.uid=window.uid||function(){
  return window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
};
</script>

<script src="js/client.js"></script>
<script src="js/home-v2.js"></script>
<script src="../cliente_opcoes.js"></script>
<script src="cliente_sacola_fix.js"></script>
<script src="acompanhamento_realtime.js"></script>
<script src="cliente_runtime_fix.js"></script>

<script>
(function(){
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const oldRenderCart=window.renderCart;
window.renderCart=function(){
  if(typeof oldRenderCart==='function')oldRenderCart();
  const c=Array.isArray(window.cart)?window.cart:[];
  const count=c.reduce((s,x)=>s+Number(x.quantidade||0),0);
  const total=c.reduce((s,x)=>s+Number(x.preco||0)*Number(x.quantidade||0),0);

  $('bagBar')?.classList.toggle('empty',count===0);
  if($('bagText'))$('bagText').textContent=count?`${count} ${count===1?'item':'itens'} na sacola`:'Sua sacola está vazia';
  if($('bagTotal'))$('bagTotal').textContent=money(total);
  if($('cartSubtotal'))$('cartSubtotal').textContent=money(total);
  if($('checkoutTotal'))$('checkoutTotal').textContent=money(total);
};

function openCart(){
  $('shade')?.classList.add('open');
  $('cartDrawer')?.classList.add('open');
  $('cartDrawer')?.setAttribute('aria-hidden','false');
}
function closeCart(){
  $('shade')?.classList.remove('open');
  $('cartDrawer')?.classList.remove('open');
  $('cartDrawer')?.setAttribute('aria-hidden','true');
}
window.closeCart=closeCart;

$('openCart')?.addEventListener('click',openCart);
$('closeCart')?.addEventListener('click',closeCart);
$('shade')?.addEventListener('click',closeCart);
$('addMoreItems')?.addEventListener('click',closeCart);

$('checkoutBtn')?.addEventListener('click',()=>{
  if(!window.cart?.length){
    window.toast?.('Adicione produtos à sacola');
    return;
  }
  closeCart();
  $('checkoutModal')?.classList.remove('hidden');
});

$('checkoutClose')?.addEventListener('click',()=>$('checkoutModal')?.classList.add('hidden'));

$('mlHome')?.addEventListener('click',function(){
  this.classList.add('active');
  $('mlOrders')?.classList.remove('active');
  $('trackingModal')?.classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});

$('mlOrders')?.addEventListener('click',function(){
  this.classList.add('active');
  $('mlHome')?.classList.remove('active');
  if(typeof window.openTracking==='function')window.openTracking();
  else $('trackingModal')?.classList.remove('hidden');
});

$('trackOrderBtn')?.addEventListener('click',()=>{
  $('successModal')?.classList.add('hidden');
  $('mlOrders')?.click();
});

$('newOrderBtn')?.addEventListener('click',()=>{
  $('successModal')?.classList.add('hidden');
  $('mlHome')?.click();
});

const modalIds=['productModal','checkoutModal','successModal'];
function syncLock(){
  const open=modalIds.some(id=>{
    const e=$(id);
    return e&&!e.classList.contains('hidden');
  });
  document.documentElement.classList.toggle('modal-lock',open);
  document.body.classList.toggle('modal-lock',open);
}
new MutationObserver(syncLock).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});

document.addEventListener('touchmove',e=>{
  if(document.body.classList.contains('modal-lock')&&!e.target.closest('.product-card,.checkout-card,.success-card'))e.preventDefault();
},{passive:false});

/* 1,5 segundos */
function hideSplash(){
  setTimeout(()=>{
    $('splash')?.classList.add('hide');
    $('site')?.classList.remove('hidden');
  },1500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hideSplash,{once:true});
else hideSplash();

})();
</script>

</body>
</html>
