<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Miguel Lanches</title>
<link rel="stylesheet" href="style.css">
<style>
#ml-footer{position:fixed;left:0;right:0;bottom:0;height:68px;background:#080808;display:flex;z-index:600;box-shadow:0 -5px 20px #0004}
#ml-footer button{flex:1;border:0;background:transparent;color:#aaa;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:21px}
#ml-footer button span{font-size:11px}
#ml-footer button.active{color:#f4bd17}
body{padding-bottom:82px}

/* CORREÇÃO: quando uma subtela/modal estiver aberta, o fundo fica travado. */
html.modal-lock,body.modal-lock{
  overflow:hidden!important;
  overscroll-behavior:none!important;
  touch-action:none!important;
}
.modal{
  z-index:1000!important;
  touch-action:none!important;
  overscroll-behavior:contain!important;
}
.modal .product-card,
.modal .checkout-card,
.modal .success-card{
  touch-action:pan-y!important;
  overscroll-behavior-y:contain!important;
  -webkit-overflow-scrolling:touch;
}
.modal .product-card,
.modal .checkout-card,
.modal .success-card{
  max-height:93vh;
  overflow-y:auto;
}
.modal-lock #ml-footer{
  z-index:50!important;
  pointer-events:none!important;
}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="splash-box"><div class="splash-logo">MIGUEL <span>LANCHES</span></div><p>Hamburgueria e Pizzaria</p><div class="loader"><i></i></div></div></div>

<div id="site" class="hidden">
<header class="header">
  <div class="logo"><img src="assets/logo.png" alt="Miguel Lanches"></div>
  <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar em Miguel Lanches" autocomplete="off"></div>
</header>
<nav id="categories" class="categories" aria-label="Categorias"></nav>

<main class="section">
  <section class="category-block">
    <div class="section-title"><h2>Destaques</h2></div>
    <div id="featured" class="featured"></div>
  </section>
  <div id="products"></div>
</main>

<div id="bagBar" class="bag-bar empty">
  <div class="bag-info"><div class="bag-icon">🛍️</div><div><b>Sua sacola</b><small id="bagText">Sua sacola está vazia</small></div></div>
  <button id="openCart" type="button">Ver sacola · <span id="bagTotal">R$ 0,00</span></button>
</div>

<div id="shade" class="shade"></div>
<div id="cartDrawer" class="cart-drawer" aria-hidden="true">
  <div class="drawer-head"><div><small>SEU PEDIDO</small><h2>Sua sacola</h2></div><button id="closeCart" class="round" type="button">×</button></div>
  <div id="cartItems" class="cart-items"></div>
  <div class="drawer-bottom">
    <div class="line"><span>Subtotal</span><strong id="cartSubtotal">R$ 0,00</strong></div>
    <button id="addMoreItems" class="main-btn" type="button" style="margin-bottom:10px;background:#fff;border:1px solid #ddd">Adicionar mais itens</button>
    <button id="checkoutBtn" class="main-btn" type="button">Finalizar o pedido</button>
  </div>
</div>

<div id="productModal" class="modal hidden"><div id="productBody" class="product-card"></div></div>
<div id="checkoutModal" class="modal hidden"><div id="checkoutBody" class="checkout-card"></div></div>

<div id="successModal" class="modal hidden">
  <div class="success-card">
    <div class="success-icon">✓</div><h2>Pedido enviado!</h2><p id="orderNumber"></p>
    <p>Seu pedido já foi enviado para a loja.</p>
    <div style="display:grid;gap:10px;margin-top:22px">
      <button id="trackOrderBtn" class="main-btn" type="button">Acompanhar pedido</button>
      <button id="newOrderBtn" class="main-btn" type="button" style="background:#fff;border:1px solid #ddd">Novo pedido</button>
    </div>
  </div>
</div>

<div id="trackingModal" class="hidden"><div id="trackingCard"><div id="trackingBody"></div></div></div>
<div id="checkoutSubtotal" class="hidden">R$ 0,00</div>
<div id="checkoutTotal" class="hidden" data-value="0">R$ 0,00</div>
<select id="neighborhood" class="hidden"></select>
</div>

<nav id="ml-footer">
  <button id="mlHome" class="active" type="button">⌂<span>Início</span></button>
  <button id="mlOrders" type="button">▣<span>Pedidos</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="../cliente_opcoes.js"></script>
<script src="cliente_final_status_opcoes.js"></script>
<script src="acompanhamento_realtime.js"></script>
<script src="integracao_acompanhamento.js"></script>

<script>
(function(){
  function showSite(){
    document.getElementById('splash')?.classList.add('hide');
    document.getElementById('site')?.classList.remove('hidden');
  }

  function startApp(){
    try{
      if(typeof window.load === 'function') window.load();
      else console.error('app.js não expôs a função load().');
    }catch(e){ console.error('Falha ao iniciar cardápio:',e); }
    setTimeout(showSite,1800);
  }

  if(document.readyState === 'complete') startApp();
  else window.addEventListener('load',startApp,{once:true});
})();

/* =========================================================
   CORREÇÃO DEFINITIVA DO GESTO DO MODAL
   O app pode abrir/fechar os modais adicionando/removendo
   a classe "hidden". O observer detecta isso automaticamente.
   ========================================================= */
(function(){
  const modalIds=['productModal','checkoutModal','successModal'];

  function modalAberto(){
    return modalIds.some(id=>{
      const el=document.getElementById(id);
      return el && !el.classList.contains('hidden');
    });
  }

  function atualizarBloqueio(){
    const lock=modalAberto();
    document.documentElement.classList.toggle('modal-lock',lock);
    document.body.classList.toggle('modal-lock',lock);
  }

  const observer=new MutationObserver(atualizarBloqueio);
  modalIds.forEach(id=>{
    const el=document.getElementById(id);
    if(el) observer.observe(el,{attributes:true,attributeFilter:['class']});
  });

  atualizarBloqueio();

  /* Impede scroll/arraste iniciado no fundo enquanto o produto está aberto. */
  document.addEventListener('touchmove',function(e){
    if(!document.body.classList.contains('modal-lock')) return;
    const card=e.target.closest('.product-card,.checkout-card,.success-card');
    if(card) return;
    e.preventDefault();
  },{passive:false});

  document.addEventListener('wheel',function(e){
    if(!document.body.classList.contains('modal-lock')) return;
    const card=e.target.closest('.product-card,.checkout-card,.success-card');
    if(card) return;
    e.preventDefault();
  },{passive:false});
})();

document.getElementById('mlHome')?.addEventListener('click',function(){
  this.classList.add('active');
  document.getElementById('mlOrders')?.classList.remove('active');
  document.getElementById('trackingModal')?.classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('mlOrders')?.addEventListener('click',function(){
  this.classList.add('active');
  document.getElementById('mlHome')?.classList.remove('active');
  if(typeof window.openTracking==='function') window.openTracking();
  else location.href='acompanhar-pedido.html';
});

document.getElementById('trackOrderBtn')?.addEventListener('click',function(){
  document.getElementById('successModal')?.classList.add('hidden');
  if(typeof window.openTracking==='function') window.openTracking();
  else location.href='acompanhar-pedido.html';
});

document.getElementById('newOrderBtn')?.addEventListener('click',function(){
  document.getElementById('successModal')?.classList.add('hidden');
  document.getElementById('trackingModal')?.classList.add('hidden');
  document.getElementById('mlHome')?.click();
});

document.getElementById('addMoreItems')?.addEventListener('click',function(){
  document.getElementById('cartDrawer')?.classList.remove('open');
  document.getElementById('shade')?.classList.remove('open');
});
</script>
</body>
</html>
