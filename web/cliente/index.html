<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Miguel Lanches — Pedido Online</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--gold:#f4bd17;--red:#e32622;--text:#171717}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--text);padding-bottom:76px}
button,input,textarea,select{font:inherit}button{cursor:pointer}img{max-width:100%}.hidden{display:none!important}
.splash{position:fixed;inset:0;z-index:9999;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:.45s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-inner{width:90%;padding:30px}
.splash-inner img{width:120px;height:92px;object-fit:contain}.splash-brand{font-weight:900}
.splash-brand span{color:var(--red)}.splash p{color:#aaa;font-size:13px}
.loader{width:160px;height:4px;background:#272727;border-radius:99px;margin:auto;overflow:hidden}
.loader i{display:block;width:50%;height:100%;background:var(--gold);animation:load 1.25s infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.site-hidden{visibility:hidden;height:100vh;overflow:hidden}
.mobile-header{height:112px;background:#050505;color:#fff;display:flex;align-items:center;padding:12px 14px;gap:14px;position:sticky;top:0;z-index:80;border-bottom:1px solid #191919}
.brand-mini{width:82px;height:82px;flex:0 0 82px;display:flex;align-items:center;justify-content:center}
.brand-mini img{width:100%;height:100%;object-fit:contain}.top-search{height:52px;flex:1;background:#242424;border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:10px}
.top-search .search-icon{font-size:28px;color:#fff}.top-search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:15px;font-weight:600}
.top-search input::placeholder{color:#bbb}
.categories-wrap{position:sticky;top:112px;z-index:70;background:#050505;border-bottom:1px solid #222}
.categories{height:48px;display:flex;gap:24px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.categories button{position:relative;flex:0 0 auto;height:48px;border:0;background:transparent;color:#eee;padding:0;font-size:13px;font-weight:800;white-space:nowrap}
.categories button.active{color:var(--gold)}.categories button.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
.home-section,.category-block{padding:0 14px}.featured-section{padding-top:20px}.section-head{display:flex;align-items:center;margin-bottom:12px}
.section-head h2{margin:0;font-size:18px}.featured-slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.featured-slider::-webkit-scrollbar{display:none}.highlight-card{scroll-snap-align:start;flex:0 0 31.5%;min-width:112px;border:1px solid #ddd;border-radius:12px;background:#fff;overflow:hidden;text-align:left;box-shadow:0 2px 7px #00000012;padding:0}
.highlight-photo{height:108px;background:#f1f1f1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.highlight-photo img{width:100%;height:100%;object-fit:cover}.highlight-photo>span{font-size:42px}
.highlight-badge{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:9px;border-radius:999px;padding:5px 8px;font-weight:900}
.highlight-body{padding:9px 10px 11px;min-height:76px}.highlight-body small{display:block;color:#777;font-size:10px}
.highlight-body strong{display:block;font-size:14px;line-height:1.2;margin-top:2px}.highlight-body span{display:block;font-size:11px;margin-top:5px}
.category-block{padding-top:18px;scroll-margin-top:170px}.category-heading{display:flex;align-items:center;margin-bottom:10px}
.category-heading>span{display:none!important}.category-heading h2{margin:0;flex:1;font-size:18px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{position:relative;border:1px solid #ddd;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 1px 5px #00000010}
.photo{height:130px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:45px}.photo img{width:100%;height:100%;object-fit:cover}
.card-body{padding:9px 10px 13px}.card-body h3{margin:0 0 5px;font-size:14px;line-height:1.2}.desc{margin:0 0 8px;color:#777;font-size:10px;line-height:1.3}
.card-foot{display:flex;align-items:center;justify-content:space-between}.price{font-weight:900;color:#d71920}
.plus{width:32px;height:32px;border:0;border-radius:50%;background:var(--gold);color:#111;font-size:21px;font-weight:900}
.bag-bar{position:fixed;left:8px;right:8px;bottom:8px;height:58px;background:#090909;color:#fff;border-radius:12px;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:5px 6px 5px 11px;box-shadow:0 8px 25px #0004}
.bag-info{display:flex;align-items:center;gap:8px}.bag-icon{font-size:22px}.bag-info b{display:block;font-size:10px}.bag-info small{display:block;color:#aaa;font-size:8px;margin-top:2px}
.bag-bar>button{height:45px;border:0;border-radius:9px;background:var(--gold);color:#111;font-weight:900;font-size:12px;padding:0 14px}
.shade{position:fixed;inset:0;background:#0009;z-index:100;opacity:0;visibility:hidden}.shade.open{opacity:1;visibility:visible}
.cart-drawer{position:fixed;left:0;right:0;bottom:0;z-index:110;max-height:86vh;transform:translateY(110%);transition:.28s;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.cart-drawer.open{transform:translateY(0)}.drawer-head{padding:18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.drawer-head h2{margin:3px 0;font-size:22px}.drawer-head button,.modal-close{border:0;background:#eee;width:36px;height:36px;border-radius:50%;font-size:22px}
.drawer-items{overflow:auto;padding:0 18px}.drawer-item{padding:12px 0;border-bottom:1px solid #eee}.drawer-item small{display:block;color:#777;font-size:10px}
.drawer-bottom{padding:12px 18px 18px;border-top:1px solid #eee}.drawer-total{display:flex;justify-content:space-between;font-size:17px;margin-bottom:10px}
.drawer-actions{display:grid;grid-template-columns:90px 1fr;gap:8px}.ghost,.primary{border:0;border-radius:10px;min-height:45px;font-weight:900}.ghost{background:#eee}.primary{background:var(--gold);color:#111}
.modal{position:fixed;inset:0;background:#000b;z-index:200;display:flex;align-items:flex-end}.modal-card{position:relative;width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:0}
@media(min-width:700px){.modal{align-items:center}.modal-card{max-width:560px;border-radius:24px}}
#productBody{padding:0}.product-main{padding:0 20px 20px}.ml-product-hero{height:205px;margin:0 -20px 18px;background:#f2f2f2;position:relative;overflow:hidden}
.ml-product-hero img{width:100%;height:100%;object-fit:cover}.ml-product-placeholder{height:100%;display:flex;align-items:center;justify-content:center;font-size:58px}
.ml-product-close{position:absolute;right:14px;top:14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:26px;font-weight:800;box-shadow:0 3px 14px #0002}
.ml-product-title{margin:0;padding-right:45px;font-size:25px;line-height:1.15;font-weight:900}.ml-product-price{margin-top:8px;font-size:21px;font-weight:900;color:#c71922}
.ml-product-desc{margin:8px 0 18px;color:#777;font-size:13px;line-height:1.45}.ml-label{display:block;margin:0 0 7px;font-size:13px;font-weight:900}
.ml-note{width:100%;min-height:76px;resize:none;border:1px solid #ddd;border-radius:13px;padding:12px;outline:none;background:#fafafa;font-size:14px}
.ml-note:focus{border-color:#e2b216;box-shadow:0 0 0 3px #f4bd1729;background:#fff}
.ml-qty-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 16px}.ml-qty-title{font-size:14px;font-weight:900}
.ml-stepper{display:flex;align-items:center;gap:13px;padding:5px;border:1px solid #ddd;border-radius:14px;background:#f7f7f7}
.ml-stepper button{width:38px;height:38px;border:0;border-radius:10px;background:#fff;font-size:24px;font-weight:800;box-shadow:0 1px 5px #0001}
.ml-qty{min-width:22px;text-align:center;font-size:16px;font-weight:900}
.ml-add{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--gold);color:#111;font-size:15px;font-weight:900}
.ml-options{display:grid;gap:8px;margin-bottom:16px}.ml-option{width:100%;border:1px solid #ddd;border-radius:13px;background:#fff;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.ml-option.selected{border-color:#e3b217;background:#fff9df;box-shadow:0 0 0 1px #e3b217 inset}.ml-option b{font-size:13px}.ml-option small{display:block;color:#777;margin-top:3px}.ml-option strong{font-size:13px}
.ml-section-title{font-size:13px;font-weight:900;margin:16px 0 8px}
@media(max-width:420px){.mobile-header{height:104px}.brand-mini{width:70px;height:70px;flex-basis:70px}.categories-wrap{top:104px}.menu-photo,.photo{height:112px}.top-search{height:48px}.top-search input{font-size:13px}.product-main{padding-left:18px;padding-right:18px}.ml-product-hero{margin-left:-18px;margin-right:-18px;height:185px}}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-inner">
    <img src="assets/logo.png" alt="Miguel Lanches" onerror="this.style.display='none'">
    <div class="splash-brand">MIGUEL <span>LANCHES</span></div>
    <p>Carregando cardápio...</p>
    <div class="loader"><i></i></div>
  </div>
</div>

<div id="site" class="site-hidden">
  <header class="mobile-header">
    <div class="brand-mini"><img src="assets/logo.png" alt="Miguel Lanches" onerror="this.style.display='none'"></div>
    <label class="top-search" aria-label="Buscar">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="Buscar em Miguel Lanches" autocomplete="off">
    </label>
  </header>

  <nav class="categories-wrap">
    <div id="categories" class="categories"></div>
  </nav>

  <main>
    <section class="home-section featured-section">
      <div class="section-head"><h2>Destaques</h2></div>
      <div id="featured" class="featured-slider"></div>
    </section>

    <section class="home-section">
      <div id="productsTitle" style="display:none">Cardápio</div>
      <div id="products"></div>
    </section>
  </main>
</div>

<div id="bagBar" class="bag-bar">
  <div class="bag-info">
    <span class="bag-icon">🛍️</span>
    <div><b id="bagText">Sua sacola está vazia</b><small id="bagMinimum">Mínimo R$ 45,00</small></div>
  </div>
  <button type="button" onclick="openCart()">Ver sacola ›</button>
</div>

<div id="shade" class="shade" onclick="closeCart()"></div>

<section id="cartDrawer" class="cart-drawer" aria-label="Sacola">
  <div class="drawer-head"><h2>Sua sacola</h2><button type="button" onclick="closeCart()">×</button></div>
  <div id="cartItems" class="drawer-items"></div>
  <div class="drawer-bottom">
    <div class="drawer-total"><span>Total</span><strong id="cartTotal">R$ 0,00</strong></div>
    <div class="drawer-actions"><button class="ghost" onclick="closeCart()">Voltar</button><button class="primary" onclick="openCheckout()">Continuar</button></div>
  </div>
</section>

<div id="productModal" class="modal hidden">
  <div class="modal-card">
    <div id="productBody"></div>
  </div>
</div>

<div id="checkoutModal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" type="button" onclick="closeCheckout()">×</button>
    <div id="checkoutBody" style="padding:22px 20px 25px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://lifsxhyeqwppfvajvhpn.supabase.co';
const SUPABASE_KEY='sb_publishable_Pgwh6gfcWc9JXorI5VlcnA_6MvHzGcQ';
let db,products=[],categories=[],cart=[],receiveMethod=null,neighborhoods=[];
const ADDRESS_KEY='miguel_lanches_cliente_v1';
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const fallback=[{id:'fb-l',nome:'Lanches',emoji:'🍔',ordem:1},{id:'fb-p',nome:'Pizzas',emoji:'🍕',ordem:2},{id:'fb-po',nome:'Porções',emoji:'🍟',ordem:3},{id:'fb-c',nome:'Churrasco',emoji:'🥩',ordem:4},{id:'fb-d',nome:'Dogão',emoji:'🌭',ordem:5},{id:'fb-b',nome:'Bebidas',emoji:'🥤',ordem:6}];
function hideSplash(){setTimeout(()=>{$('splash')?.classList.add('hide');$('site')?.classList.remove('site-hidden')},1500)}
function saved(){try{return JSON.parse(localStorage.getItem(ADDRESS_KEY)||'null')}catch{return null}}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('miguel_cart_v2')||'[]')}catch{cart=[]}}
function saveCart(){localStorage.setItem('miguel_cart_v2',JSON.stringify(cart));renderCart()}
async function load(){
 try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){console.error(e);return renderEmpty('Não foi possível iniciar o cardápio.')}
 try{
   const [c,p]=await Promise.all([
    db.from('categorias').select('*').eq('ativo',true).order('ordem'),
    db.from('produtos').select('*,categorias(nome,emoji,imagem_url)').eq('ativo',true).order('ordem')
   ]);
   categories=(!c.error&&c.data?.length?c.data:fallback).filter(x=>norm(x.nome)!=='todos');
   products=(!p.error&&p.data?p.data:[]);
   renderCategories();renderFeatured();renderProducts();renderCart();loadNeighborhoods();
 }catch(e){console.error(e);renderEmpty('Erro ao carregar o cardápio.');}
}
async function loadNeighborhoods(){try{const r=await db.from('bairros').select('*').eq('ativo',true).order('nome');neighborhoods=r.data||[]}catch{} }
function renderEmpty(msg){$('featured').innerHTML='';$('products').innerHTML='<div style="padding:30px 14px;text-align:center;color:#777">'+esc(msg)+'</div>'}
function renderCategories(){
 $('categories').innerHTML=categories.map(c=>`<button data-cat="${esc(c.id)}"><span style="display:none">${esc(c.emoji||'')}</span>${esc(c.nome)}</button>`).join('');
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const el=document.getElementById('cat-'+String(b.dataset.cat).replace(/[^a-zA-Z0-9_-]/g,'-'));el?.scrollIntoView({behavior:'smooth',block:'start'});});
}
function renderFeatured(){
 const list=products.filter(p=>p.destaque===true||p.destaque===1||p.destaque==='true').slice(0,10);
 $('featured').innerHTML=list.length?list.map(p=>`<button class="highlight-card" onclick="openProduct('${esc(p.id)}')"><div class="highlight-photo">${p.imagem_url?`<img src="${esc(p.imagem_url)}" alt="${esc(p.nome)}">`:`<span>${esc(p.emoji||p.categorias?.emoji||'🍔')}</span>`}<span class="highlight-badge">DESTAQUE</span></div><div class="highlight-body"><small>${esc(p.categorias?.nome||'Mais pedido')}</small><strong>${esc(p.nome)}</strong><span class="highlight-price">${money(p.preco)}</span></div></button>`).join(''):'<div style="padding:10px 2px;color:#777">Nenhum destaque cadastrado.</div>';
}
function renderProducts(){
 const q=norm($('search')?.value||'');
 const list=products.filter(p=>!q||norm(p.nome).includes(q)||norm(p.descricao).includes(q));
 const html=categories.map(c=>{const items=list.filter(p=>String(p.categoria_id)===String(c.id));if(!items.length)return '';return `<section class="category-block" id="cat-${String(c.id).replace(/[^a-zA-Z0-9_-]/g,'-')}"><div class="category-heading"><h2>${esc(c.nome)}</h2></div><div class="products">${items.map(card).join('')}</div></section>`}).join('');
 const unc=list.filter(p=>!categories.some(c=>String(c.id)===String(p.categoria_id)));
 $('products').innerHTML=html+(unc.length?`<section class="category-block"><div class="category-heading"><h2>Outros</h2></div><div class="products">${unc.map(card).join('')}</div></section>`:'')||'<div style="padding:30px 14px;text-align:center;color:#777">Nenhum produto encontrado.</div>';
}
function card(p){return `<article class="card" onclick="openProduct('${esc(p.id)}')"><div class="photo">${p.imagem_url?`<img src="${esc(p.imagem_url)}" alt="${esc(p.nome)}">`:`<span>${esc(p.emoji||p.categorias?.emoji||'🍔')}</span>`}</div><div class="card-body"><h3>${esc(p.nome)}</h3><div class="desc">${esc(p.descricao||'Toque para ver as opções.')}</div><div class="card-foot"><span class="price">${money(p.preco)}</span><button class="plus" onclick="event.stopPropagation();openProduct('${esc(p.id)}')">+</button></div></div></article>`}
function isPizza(p){return norm(p.categorias?.nome).includes('pizza')||norm(p.nome).includes('pizza')}
function isPastel(p){return norm(p.categorias?.nome).includes('pastel')||norm(p.nome).includes('pastel')}
function isAcai(p){return norm(p.categorias?.nome).includes('acai')||norm(p.nome).includes('acai')}
function openProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;let body=`<div class="product-main"><div class="ml-product-hero">${p.imagem_url?`<img src="${esc(p.imagem_url)}" alt="${esc(p.nome)}">`:`<div class="ml-product-placeholder">${esc(p.emoji||p.categorias?.emoji||'🍔')}</div>`}<button class="ml-product-close" onclick="closeProduct()">×</button></div><h2 class="ml-product-title">${esc(p.nome)}</h2><div class="ml-product-price">${money(p.preco)}</div><p class="ml-product-desc">${esc(p.descricao||'')}</p>`;
 if(isPizza(p)){const two=norm(p.nome).includes('2 sabores')||norm(p.nome).includes('2 sabor')||norm(p.nome).includes('duas');const flavors=products.filter(x=>isPizza(x)&&String(x.id)!==String(p.id)).slice(0,20);body+=`<div class="ml-section-title">Escolha ${two?'2 sabores':'1 sabor'}</div><div class="ml-options">${flavors.map(f=>`<button type="button" class="ml-option pizza-opt" data-price="${Number(f.preco||0)}" data-name="${esc(f.nome)}" onclick="pickPizza(this,${two})"><b>${esc(f.nome)}</b><strong>${money(f.preco)}</strong></button>`).join('')}</div>`}
 else if(isPastel(p)){const sabores=products.filter(x=>isPastel(x)&&String(x.id)!==String(p.id)).slice(0,30);body+=`<div class="ml-section-title">Tamanho</div><div class="ml-options"><button class="ml-option size-opt selected" data-size="M" data-price="${Number(p.preco||0)}" onclick="pickOne('.size-opt',this)"><b>Pastel M</b><strong>${money(p.preco)}</strong></button><button class="ml-option size-opt" data-size="G" data-price="${Number(p.preco||0)}" onclick="pickOne('.size-opt',this)"><b>Pastel G</b><strong>${money(p.preco)}</strong></button></div><div class="ml-section-title">Sabor</div><div class="ml-options">${sabores.map(f=>`<button class="ml-option flavor-opt" data-name="${esc(f.nome)}" data-price="${Number(f.preco||0)}" onclick="pickOne('.flavor-opt',this)"><b>${esc(f.nome)}</b><strong>${money(f.preco)}</strong></button>`).join('')}</div>`}
 else if(isAcai(p)){body+=`<div class="ml-section-title">Tamanho</div><div class="ml-options">${['200 ml','300 ml','500 ml','1 litro'].map((s,i)=>`<button class="ml-option acai-size ${i===0?'selected':''}" data-size="${s}" onclick="pickOne('.acai-size',this)"><b>${s}</b><strong>${i===0?money(p.preco):'Consultar'}</strong></button>`).join('')}</div><div class="ml-section-title">Coberturas (até 3)</div><div class="ml-options">${['Leite em pó','Leite condensado','Paçoca','Granola','Morango','Banana','Ovomaltine','Confete'].map(n=>`<button class="ml-option top-opt" data-name="${esc(n)}" onclick="toggleTop(this)"><b>${n}</b></button>`).join('')}</div>`}
 body+=`<label class="ml-label">Observação (opcional)</label><textarea id="mlNote" class="ml-note" placeholder="Ex.: sem cebola..."></textarea><div class="ml-qty-row"><span class="ml-qty-title">Quantidade</span><div class="ml-stepper"><button onclick="changeModalQty(-1)">−</button><span id="mlQty" class="ml-qty">1</span><button onclick="changeModalQty(1)">+</button></div></div><button class="ml-add" onclick="addCurrent('${esc(p.id)}')">ADICIONAR À SACOLA</button></div>`;
 $('productBody').innerHTML=body;$('productModal').classList.remove('hidden');window._modalQty=1;
}
function changeModalQty(d){window._modalQty=Math.max(1,Math.min(99,(window._modalQty||1)+d));$('mlQty').textContent=window._modalQty}
function pickOne(sel,el){document.querySelectorAll(sel).forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function pickPizza(el,two){if(!two)document.querySelectorAll('.pizza-opt').forEach(x=>x.classList.remove('selected'));if(two&&!el.classList.contains('selected')&&document.querySelectorAll('.pizza-opt.selected').length>=2)return;el.classList.toggle('selected')}
function toggleTop(el){const n=document.querySelectorAll('.top-opt.selected').length;if(!el.classList.contains('selected')&&n>=3)return;el.classList.toggle('selected')}
function closeProduct(){$('productModal').classList.add('hidden')}
function addCurrent(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const qty=window._modalQty||1,note=($('mlNote')?.value||'').trim();let item={id:uid(),nome:p.nome,preco:Number(p.preco||0),obs:note,quantidade:qty,config:{tipo:'normal'}};
 if(isPizza(p)){const two=norm(p.nome).includes('2 sabores')||norm(p.nome).includes('2 sabor')||norm(p.nome).includes('duas');const o=[...document.querySelectorAll('.pizza-opt.selected')];if(o.length!==(two?2:1))return alert(two?'Escolha 2 sabores.':'Escolha 1 sabor.');item.nome=`${p.nome} — ${o.map(x=>x.dataset.name).join(' + ')}`;item.preco=Math.max(Number(p.preco||0),...o.map(x=>Number(x.dataset.price||0)));item.config={tipo:two?'pizza-2-sabores':'pizza-1-sabor',sabores:o.map(x=>x.dataset.name)}}
 else if(isPastel(p)){const s=document.querySelector('.size-opt.selected'),f=document.querySelector('.flavor-opt.selected');if(!s||!f)return alert('Escolha o tamanho e 1 sabor.');item={...item,nome:`Pastel ${s.dataset.size} — ${f.dataset.name}`,preco:Math.max(Number(s.dataset.price||0),Number(f.dataset.price||0)),config:{tipo:'pastel',tamanho:s.dataset.size,sabor:f.dataset.name}}}
 else if(isAcai(p)){const s=document.querySelector('.acai-size.selected'),tops=[...document.querySelectorAll('.top-opt.selected')].map(x=>x.dataset.name);if(!s)return alert('Escolha o tamanho.');item={...item,nome:`Açaí ${s.dataset.size}${tops.length?' — '+tops.join(', '):''}`,config:{tipo:'acai',tamanho:s.dataset.size,coberturas:tops}}}
 cart.push(item);saveCart();closeProduct();openCart()}
function openCart(){$('cartDrawer').classList.add('open');$('shade').classList.add('open')}
function closeCart(){$('cartDrawer').classList.remove('open');$('shade').classList.remove('open')}
function renderCart(){const count=cart.reduce((a,x)=>a+Number(x.quantidade||0),0),sub=cart.reduce((a,x)=>a+Number(x.preco||0)*Number(x.quantidade||0),0);$('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="drawer-item"><div><b>${x.quantidade}x ${esc(x.nome)}</b>${x.config?.coberturas?.length?`<small>Coberturas: ${esc(x.config.coberturas.join(', '))}</small>`:''}${x.config?.sabores?.length?`<small>Sabores: ${esc(x.config.sabores.join(' + '))}</small>`:''}${x.obs?`<small>Obs.: ${esc(x.obs)}</small>`:''}</div><strong>${money(x.preco*x.quantidade)}</strong><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><span>${x.quantidade}</span><button onclick="changeQty('${x.id}',1)">+</button><button onclick="removeItem('${x.id}')">Excluir</button></div></div>`).join(''):'<div class="empty-cart">Sua sacola está vazia.</div>';$('cartTotal').textContent=money(sub);$('bagText').textContent=count?`${count} item${count>1?'s':''} na sacola`:'Sua sacola está vazia'}
function changeQty(id,d){const x=cart.find(i=>String(i.id)===String(id));if(!x)return;x.quantidade+=d;if(x.quantidade<1)cart=cart.filter(i=>i!==x);saveCart()}
function removeItem(id){cart=cart.filter(i=>String(i.id)!==String(id));saveCart()}
function closeCheckout(){$('checkoutModal').classList.add('hidden')}
function openCheckout(){if(!cart.length)return alert('Sua sacola está vazia.');closeCart();renderCheckout();$('checkoutModal').classList.remove('hidden')}
function renderCheckout(){const d=saved(),sub=cart.reduce((a,x)=>a+Number(x.preco||0)*Number(x.quantidade||0),0);$('checkoutBody').innerHTML=`<h2>Como você quer receber?</h2><div class="receive-grid"><button class="receive" data-method="entrega" onclick="selectReceive('entrega')"><b>Entrega</b><small>Receba em casa</small></button><button class="receive" data-method="retirada" onclick="selectReceive('retirada')"><b>Retirada</b><small>Busque na loja</small></button></div><div class="customer-box"><label>Nome *</label><input id="customerName" value="${esc(d?.nome||'')}" placeholder="Seu nome"><label>WhatsApp *</label><input id="customerPhone" value="${esc(d?.telefone||'')}" placeholder="(00) 00000-0000"></div><div id="deliveryBox" class="delivery-box hidden"><label>Bairro *</label><select id="neighborhood"><option value="">Bairro *</option>${neighborhoods.map(n=>`<option>${esc(n.nome)}</option>`).join('')}</select><label>Endereço *</label><input id="address" value="${esc(d?.endereco||'')}" placeholder="Rua, número"><label>Referência</label><input id="reference" value="${esc(d?.referencia||'')}" placeholder="Ponto de referência"></div><label style="display:block;font-size:11px;font-weight:800;margin-top:12px">Forma de pagamento *</label><select id="payment" onchange="updatePayment()"><option value="">Forma de pagamento *</option><option>Dinheiro</option><option>Pix</option><option>Cartão</option></select><div id="cashBox" class="cash-box hidden"><label>Valor pago</label><input id="cashValue" type="number" step="0.01" placeholder="Ex.: 50,00" oninput="updateChange()"><div class="change-row"><span>Troco</span><strong id="change"></strong></div></div><label style="display:block;font-size:11px;font-weight:800;margin-top:12px">Observações</label><textarea id="orderNote" placeholder="Alguma observação?"></textarea><div class="checkout-totals"><span><span>Subtotal</span><b>${money(sub)}</b></span><span><span>Entrega</span><b>R$ 0,00</b></span><strong><span>Total</span><b id="checkoutTotal">${money(sub)}</b></strong></div><button class="primary full" style="min-height:52px" onclick="sendOrder()">Enviar pedido</button>`;if(d){} }
function selectReceive(m){receiveMethod=m;document.querySelectorAll('.receive').forEach(x=>x.classList.toggle('selected',x.dataset.method===m));$('deliveryBox').classList.toggle('hidden',m!=='entrega')}
function updatePayment(){const cash=$('payment').value==='Dinheiro';$('cashBox').classList.toggle('hidden',!cash);if(!cash){$('cashValue').value='';$('change').textContent=''}else updateChange()}
function updateChange(){const paid=Number($('cashValue')?.value||0),total=cart.reduce((a,x)=>a+Number(x.preco||0)*Number(x.quantidade||0),0);$('change').textContent=paid>=total&&paid?money(paid-total):''}
async function sendOrder(){
 if(!receiveMethod)return alert('Escolha Entrega ou Retirada.');if(!$('customerName').value.trim()||!$('customerPhone').value.trim())return alert('Informe nome e WhatsApp.');if(!$('payment').value)return alert('Escolha a forma de pagamento.');const delivery=receiveMethod==='entrega';if(delivery&&!$('address').value.trim())return alert('Informe o endereço.');const total=cart.reduce((a,x)=>a+Number(x.preco||0)*Number(x.quantidade||0),0);if($('payment').value==='Dinheiro'&&Number($('cashValue').value||0)<total)return alert('O valor pago precisa ser igual ou maior que o total.');
 const payload={cliente:$('customerName').value.trim(),telefone:$('customerPhone').value.trim(),forma_recebimento:receiveMethod,bairro:delivery?$('neighborhood').value:'',endereco:delivery?$('address').value.trim():'',referencia:delivery?$('reference').value.trim():'',pagamento:$('payment').value,valor_pago:$('payment').value==='Dinheiro'?Number($('cashValue').value||0):null,total,observacoes:$('orderNote').value.trim(),itens:cart};
 const r=await db.from('pedidos').insert(payload).select('id').maybeSingle();if(r.error){console.error(r.error);return alert('Não foi possível enviar o pedido. Tente novamente.')}
 if(delivery)localStorage.setItem(ADDRESS_KEY,JSON.stringify({nome:payload.cliente,telefone:payload.telefone,bairro:payload.bairro,endereco:payload.endereco,referencia:payload.referencia}));
 cart=[];saveCart();closeCheckout();alert('Pedido enviado com sucesso! Nº '+String(r.data?.id||'').slice(-5));
}
window.openCheckout=openCheckout;window.openCart=openCart;window.closeCart=closeCart;window.closeProduct=closeProduct;window.openProduct=openProduct;window.changeQty=changeQty;window.removeItem=removeItem;window.selectReceive=selectReceive;window.updatePayment=updatePayment;window.updateChange=updateChange;window.sendOrder=sendOrder;window.pickOne=pickOne;window.pickPizza=pickPizza;window.toggleTop=toggleTop;window.changeModalQty=changeModalQty;window.addCurrent=addCurrent;
document.addEventListener('DOMContentLoaded',()=>{loadCart();$('search').addEventListener('input',renderProducts);load();hideSplash()});
})();
</script>
