<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miguel Lanches — Pedidos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section id="login" class="card login-card">
<div class="brand">MIGUEL LANCHES</div>
<p class="muted">Sistema de pedidos</p>
<label>Usuário<input id="username" placeholder="Usuário"></label>
<label>Senha<input id="password" type="password" placeholder="Senha"></label>
<button id="loginBtn" class="primary">Entrar</button>
<p id="loginMsg" class="error"></p>
<p class="hint">Protótipo inicial. O login real será protegido pelo servidor na próxima etapa.</p>
</section>

<section id="orders" class="hidden">
<header class="topbar">
<div><strong>MIGUEL LANCHES</strong><span>Pedidos</span></div>
<button id="logoutBtn" class="ghost">Sair</button>
</header>
<div class="grid">
<section class="card">
<h2>Novo pedido</h2>
<div class="row">
<label>Cliente<input id="cliente" placeholder="Nome"></label>
<label>Telefone<input id="telefone" placeholder="Telefone"></label>
</div>
<label>Endereço<input id="endereco" placeholder="Rua, número, bairro"></label>
<label>Referência<input id="referencia" placeholder="Ponto de referência"></label>
<h3>Itens</h3>
<div id="items"></div>
<button id="addItemBtn" class="secondary">+ Adicionar item</button>
<label>Observações<textarea id="observacoes" placeholder="Observações"></textarea></label>
<div class="total">Total: <span id="total">R$ 0,00</span></div>
<button id="sendBtn" class="primary">Enviar pedido</button>
</section>
<aside class="card">
<h2>Pedidos enviados</h2>
<div id="ordersList"><p class="muted">Nenhum pedido nesta sessão.</p></div>
</aside>
</div>
</section>
</main>
<script src="app.js?v=2" defer></script>
</body>
</html>
